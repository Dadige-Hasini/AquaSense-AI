server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: aquasense-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/aquasense_db}
    username: ${SPRING_DATASOURCE_USERNAME:aquasense}
    password: ${SPRING_DATASOURCE_PASSWORD:aquasense_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# Microservices integration configuration
integrations:
  ml-service:
    url: ${ML_SERVICE_URL:http://localhost:8000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
